name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"

      - name: Set up Python
        run: uv python install 3.11.9

      - name: Install dependencies
        working-directory: aeo-platform
        run: uv sync --all-packages --group dev

      - name: Ruff check
        working-directory: aeo-platform
        run: uv run ruff check apps packages

      - name: Ruff format
        working-directory: aeo-platform
        run: uv run ruff format --check apps packages

      - name: Mypy
        working-directory: aeo-platform
        run: uv run python -m mypy apps packages

      - name: Pytest
        working-directory: aeo-platform
        env:
          DB_URL: postgresql+asyncpg://aeo:aeo@localhost:5432/aeo
          DB_URL_SYNC: postgresql+psycopg://aeo:aeo@localhost:5432/aeo
          REDIS_URL: redis://localhost:6379/0
          LLM_BASE_URL: https://api.openai.com/v1
          LLM_API_KEY: test-key
          EMBED_BASE_URL: https://api.openai.com/v1
          EMBED_API_KEY: test-key
          AUTH_API_KEY: test-key
          RAG_USE_HASH_EMBEDDINGS: "true"
          RAG_SCORE_THRESHOLD: "0.0"
        run: >
          uv run pytest
          apps/api/tests
          apps/browser/tests
          apps/orchestrator/tests
          packages/shared/tests
          packages/llm/tests
          packages/rag/tests
          --cov=apps
          --cov=packages
          --cov-report=term-missing:skip-covered
          --cov-fail-under=70

      - name: Docker build
        working-directory: aeo-platform
        run: docker compose -f infra/compose/docker-compose.dev.yml build api

      - name: Validate prod compose
        working-directory: aeo-platform
        run: |
          cp .env.prod.example .env.prod
          docker compose --env-file .env.prod -f infra/compose/docker-compose.prod.yml config

      - name: Docker build prod images
        working-directory: aeo-platform
        run: |
          cp .env.prod.example .env.prod
          docker compose --env-file .env.prod -f infra/compose/docker-compose.prod.yml build api web

  lint-and-build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: aeo-platform/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: aeo-platform
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: aeo-platform
        run: pnpm lint

      - name: Typecheck
        working-directory: aeo-platform
        run: pnpm typecheck

      - name: Next.js build
        working-directory: aeo-platform/apps/web
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: pnpm build
