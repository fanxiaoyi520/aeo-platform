[project]
name = "aeo-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aeo-shared",
    "aeo-llm",
    "aeo-rag",
    "aeo-orchestrator",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "redis>=5.1.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
aeo-shared = { workspace = true }
aeo-llm = { workspace = true }
aeo-rag = { workspace = true }
aeo-orchestrator = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
