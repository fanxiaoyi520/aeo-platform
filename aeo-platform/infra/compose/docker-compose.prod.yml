services:
  postgres:
    image: postgres:16.4
    container_name: aeo-postgres-prod
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeo_prod_password}
      POSTGRES_DB: aeo
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo -d aeo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7.4
    container_name: aeo-redis-prod
    command: >
      redis-server
      --save 60 1
      --save 300 100
      --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: aeo-api-prod
    env_file:
      - ../../.env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_URL: postgresql+asyncpg://aeo:${POSTGRES_PASSWORD:-aeo_prod_password}@postgres:5432/aeo
      DB_URL_SYNC: postgresql+psycopg://aeo:${POSTGRES_PASSWORD:-aeo_prod_password}@postgres:5432/aeo
      REDIS_URL: redis://redis:6379/0
      CHROMA_PATH: data/chroma
      KNOWLEDGE_PATH: knowledge
      RAG_USE_HASH_EMBEDDINGS: "true"
      RAG_SCORE_THRESHOLD: "0.0"
    volumes:
      - ../../knowledge:/app/knowledge:ro
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 1G

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: aeo-web-prod
    env_file:
      - ../../.env.prod
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aeo-prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aeo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aeo_grafana_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/aeo-overview.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  nginx:
    image: nginx:1.27-alpine
    container_name: aeo-nginx
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - aeo-internal
    restart: unless-stopped
    profiles:
      - tls
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 64M

  certbot:
    image: certbot/certbot
    container_name: aeo-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"
    networks:
      - aeo-internal
    profiles:
      - tls
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  aeo-internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  chroma_data:
  prometheus_data:
  grafana_data:
  certbot_certs:
  certbot_webroot:
