services:
  postgres:
    image: postgres:16.4
    container_name: aeo-postgres-prod
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeo_prod_password}
      POSTGRES_DB: aeo
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo -d aeo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7.4
    container_name: aeo-redis-prod
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: aeo-api-prod
    env_file:
      - ../../.env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_URL: postgresql+asyncpg://aeo:${POSTGRES_PASSWORD:-aeo_prod_password}@postgres:5432/aeo
      DB_URL_SYNC: postgresql+psycopg://aeo:${POSTGRES_PASSWORD:-aeo_prod_password}@postgres:5432/aeo
      REDIS_URL: redis://redis:6379/0
      CHROMA_PATH: data/chroma
      KNOWLEDGE_PATH: knowledge
      RAG_USE_HASH_EMBEDDINGS: "true"
      RAG_SCORE_THRESHOLD: "0.0"
    volumes:
      - ../../knowledge:/app/knowledge:ro
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 1G

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: aeo-web-prod
    env_file:
      - ../../.env.prod
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aeo-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 256M

networks:
  aeo-internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  chroma_data:
