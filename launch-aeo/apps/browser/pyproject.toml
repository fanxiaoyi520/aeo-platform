[project]
name = "aeo-browser"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aeo-shared",
]

[tool.uv.sources]
aeo-shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
