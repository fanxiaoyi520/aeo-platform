services:
  postgres:
    image: postgres:16.4
    container_name: aeo-postgres
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: aeo_dev_password
      POSTGRES_DB: aeo
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo -d aeo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aeo-internal

  redis:
    image: redis:7.4
    container_name: aeo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aeo-internal

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: aeo-api
    env_file:
      - ../../.env
    environment:
      DB_URL: postgresql+asyncpg://aeo:aeo_dev_password@postgres:5432/aeo
      DB_URL_SYNC: postgresql+psycopg://aeo:aeo_dev_password@postgres:5432/aeo
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aeo-internal

networks:
  aeo-internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:
